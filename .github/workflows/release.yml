name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify version match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION=$(python3 -c 'import json; print(json.load(open("src/module.json"))["version"])')
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "ERROR: tag $TAG_VERSION does not match src/module.json version $MODULE_VERSION"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - name: Offline tests
        run: bash tests/run_tests.sh

      - name: Cross-compile with Docker
        run: |
          docker build -t module-builder -f scripts/Dockerfile scripts
          docker run --rm -v "$PWD:/build" -w /build module-builder ./scripts/build.sh

      - name: Check the tarball
        run: |
          tar -tzf dist/compressor-module.tar.gz | sort > contents.txt
          cat contents.txt
          for f in compressor/compressor.so compressor/module.json compressor/help.json compressor/canvas.js; do
            grep -qx "$f" contents.txt || { echo "ERROR: $f missing from tarball"; exit 1; }
          done
          tar -xzf dist/compressor-module.tar.gz -O compressor/compressor.so > /tmp/compressor.so
          file /tmp/compressor.so | grep -q 'ARM aarch64' || { echo "ERROR: compressor.so is not aarch64"; exit 1; }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/compressor-module.tar.gz

      - name: Commit release.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git fetch origin main
          git checkout -f main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cat > release.json << EOF
          {
            "version": "${VERSION}",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/compressor-module.tar.gz"
          }
          EOF
          git add release.json
          git commit -m "chore: update release.json for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin main
